[project]
name = "bigship-ai-agent"
version = "0.1.0"
description = "AI agent for Bigship dashboard — LangGraph + FastAPI microservice"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langchain-openai>=0.2.0",
    "pydantic-settings>=2.0.0",
    "bigship-sdk @ file:///run/media/agamya/Storage/BigShip/bigship-sdk-python",
    "bcrypt>=4.0",
    "cryptography>=42",
    "langgraph>=1.2.11",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "httpx>=0.27.0",
]

[project.scripts]
bigship-agent = "agent.main:run"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
